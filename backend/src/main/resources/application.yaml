spring:
  datasource:
    # In-memory SQLite. The whole DB lives in RAM and is gone when the app stops —
    # nothing to install, no container, no external server.
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlite::memory:}
    driver-class-name: org.sqlite.JDBC
    hikari:
      # A :memory: SQLite database belongs to a single connection, so we keep exactly one
      # connection alive for the whole app lifetime — otherwise the data would vanish.
      maximum-pool-size: 1
      minimum-idle: 1
      max-lifetime: 0
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      # Hibernate builds the schema from your @Entity mapping at startup.
      ddl-auto: ${SPRING_JPA_DDL_AUTO:update}
    show-sql: true

server:
  port: ${SERVER_PORT:8080}
